name: Benchmarks (utils)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - torch_brain/utils/**
      - pyproject.toml
      - scripts/benchmarks/**
      - .github/workflows/benchmarks-utils.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  compare-with-base:
    runs-on: ubuntu-latest
    steps:
      # Default pull_request checkout: the PR merged into the current base tip.
      # Its first parent (HEAD^1) is that base tip, so the comparison measures only
      # the PR's changes even when the PR branch is behind the base branch.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package and dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run benchmark comparison (base vs PR merged into base)
        id: benchmark
        run: |
          uv run python scripts/benchmarks/compare.py --suite utils --markdown benchmark-report.md HEAD^1 HEAD

      - name: Upsert PR benchmark comment
        if: ${{ !cancelled() && hashFiles('benchmark-report.md') != '' }}
        uses: actions/github-script@v7
        env:
          BENCHMARK_REPORT_PATH: benchmark-report.md
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- benchmark-ci-report:utils -->";
            const reportPath = process.env.BENCHMARK_REPORT_PATH;
            const baseRef = process.env.BASE_REF;
            const report = fs.readFileSync(reportPath, "utf8");

            const body = `${marker}
            ## Benchmark comparison vs ${baseRef} (torch_brain.utils)

            Baseline: \`${baseRef}\` tip · Target: this PR merged into \`${baseRef}\`

            ${report}
            `;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100,
              }
            );

            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" &&
                comment.body &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
