name: Pipeline Testing Matrix

on:
  push:
    branches: [ "main" ]
    paths:
      - "torch_brain/data/**"
      - "torch_brain/pipeline/**"
      - "torch_brain/utils/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline_testing*.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "torch_brain/data/**"
      - "torch_brain/pipeline/**"
      - "torch_brain/utils/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline_testing*.yml"
  schedule:
    # Weekly run to catch upstream breakage (data servers, external deps)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-testing-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        path: src
        fetch-depth: 0 # setuptools-scm needs tags to compute the version
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.11"

    # Install from a wheel to catch packaging errors
    - name: Build and install the project
      run: |
        uv build --out-dir dist src
        uv pip install --system dist/*.whl

    - name: Download pei_pandarinath_nlb_2021
      run: |
        brainsets config set --raw-dir data/raw --processed-dir data/processed
        brainsets prepare pei_pandarinath_nlb_2021