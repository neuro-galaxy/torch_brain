name: Pipeline Testing Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  pipeline-testing-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.11"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the project from git ref
      # We install the package from a git ref to catch packaging problems.
      # For PRs, we use the PR merged into the base branch using its merge ref
      # (refs/pull/N/merge).
      # For everything else (push, schedule, dispatch), we use the triggering
      # commit's SHA directly.
      run: |
        REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # REF="refs/pull/${{ github.event.pull_request.number }}/merge"
          REF="${{ github.sha }}"
        else
          REF="${{ github.sha }}"
        fi
        uv pip install --system "torch_brain @ git+${REPO_URL}@${REF}"

    - name: Debug installed ref
      run: |
        echo "merge sha: ${{ github.sha }}"
        echo "head sha:  ${{ github.event.pull_request.head.sha }}"
        uv pip freeze | grep -i torch

    - name: Download pei_pandarinath_nlb_2021
      run: |
        brainsets config set --raw-dir data/raw --processed-dir data/processed
        brainsets prepare pei_pandarinath_nlb_2021