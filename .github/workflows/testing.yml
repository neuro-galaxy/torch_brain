name: Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Setup virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install uv
    - name: Install dependencies
      run: |
        source venv/bin/activate
        uv pip install --upgrade pip
        uv pip install -e ".[dev]"
        uv pip install lightning
    - name: Install plugin
      run: |
        source venv/bin/activate
        uv pip install pytest-github-actions-annotate-failures
    - name: Cache POYO model checkpoint for testing
      id: ckpt-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/torch_brain
        key: torch-brain-${{ hashFiles('tests/poyo_checkpoint.sha256') }}
    - name: Download POYO checkpoint
      if: steps.ckpt-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.cache/torch_brain
        cd ~/.cache/torch_brain
        aws s3 cp --no-sign-request s3://torch-brain/model-zoo/$(awk '{print $2}' "$GITHUB_WORKSPACE/tests/poyo_checkpoint.sha256") .
        sha256sum -c "$GITHUB_WORKSPACE/tests/poyo_checkpoint.sha256"
    - name: Test with pytest
      run: |
        source venv/bin/activate
        export WANDB_MODE=dryrun
        pytest --cov=torch_brain --cov-report=xml --cov-report=term-missing -v
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Test documentation
      run: |
        source venv/bin/activate
        pytest --doctest-modules torch_brain/ -v --ignore=torch_brain/pipeline/brainsets-pipelines/
    - name: Download sample dataset
      run: |
        source venv/bin/activate
        brainsets config set --raw-dir data/raw --processed-dir data/processed
        brainsets prepare pei_pandarinath_nlb_2021
    - name: Test NLB minimal example
      run: |
        source venv/bin/activate
        uv pip install scikit-learn
        python examples/nlb_maze_minimal/train.py --model Linear --epochs 1
    - name: Train a POYO model
      run: |
        source venv/bin/activate
        uv pip install wandb hydra-core
        python examples/poyo/train_simple.py --config-name train_mc_maze_small.yaml data_root=data/processed wandb.mode=disabled epochs=2 optim.lr_decay_start=0.
